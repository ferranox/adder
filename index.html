<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adder — readable Python-like language</title>
<style>
  body { font-family: sans-serif; margin: 1em; }
  h1 { margin: 0; }
  .toolbar { margin: 0.5em 0; }
  .toolbar button, .toolbar label { margin-right: 0.3em; }
  main { display: flex; gap: 1em; }
  .pane { flex: 1; }
  #editor, #output { width: 100%; height: 300px; box-sizing: border-box; font-family: monospace; }
  #editor { padding: 0.5em; }
  #output { border: 1px solid; padding: 0.5em; margin: 0; white-space: pre-wrap; }
  #status { margin-top: 0.5em; }
  footer { margin-top: 1em; padding-top: 0.5em; border-top: 1px solid #ccc; font-size: 0.9em; color: #555; }
  @media (max-width: 700px) { main { flex-direction: column; } }
</style>
</head>
<body>
<header>
  <h1>Adder</h1>
</header>
<div class="toolbar">
  <button id="runButton" class="primary" type="button">Run</button>
  <button id="viewAdderButton" class="active" type="button">Adder</button>
  <button id="viewPythonButton" type="button">Python</button>
  <button id="downloadButton" type="button">Download .py</button>
  <label class="upload-label" for="uploadInput">Upload .py</label>
  <input id="uploadInput" type="file" accept=".py,text/plain" hidden>
</div>
<main>
  <section class="pane">
    <h2>Code</h2>
    <textarea id="editor" spellcheck="false"></textarea>
  </section>
  <section class="pane">
    <h2>Output</h2>
    <pre id="output"></pre>
  </section>
</main>
<div id="status" role="status"></div>
<footer>© 2026 Alex Bowles. All rights reserved.</footer>
<script src="adder.js"></script>
<script src="runtime.js"></script>
<script src="app.js"></script>
</body>
</html>
